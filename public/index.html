<style>
  :root{
    --ink:#1c2530; --ink-soft:#4a5560; --ink-mute:#8892a0;
    --paper:#f6f7f9; --card:#ffffff; --line:#e5e8ec; --line-strong:#d3d8de;
    --accent:#2f6f5e; --accent-soft:#e5f0ec; --accent-ink:#1e4d40;
    --db:#2a5b8c; --db-soft:#e6eef6;
    --acq:#8a5a2b; --acq-soft:#f5ebdd;
    --ok:#2f7d4f; --ok-soft:#e4f2e9;
    --hold:#9a7714; --hold-soft:#f7efd6;
    --no:#a33636; --no-soft:#f7e4e4;
    --radius:12px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(28,37,48,.04),0 2px 8px rgba(28,37,48,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e8eaed; --ink-soft:#aab2bd; --ink-mute:#7c8794;
      --paper:#14181d; --card:#1d232a; --line:#2b323b; --line-strong:#3a424c;
      --accent:#5dbfa3; --accent-soft:#1e2e2a; --accent-ink:#9fe1cb;
      --db:#7bb0e0; --db-soft:#1a2733;
      --acq:#d3a066; --acq-soft:#2c2418;
      --ok:#6bc48c; --ok-soft:#1a2a20;
      --hold:#d8bd63; --hold-soft:#2a2716;
      --no:#e08585; --no-soft:#2c1c1c;
      --shadow:0 1px 2px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh;}
  .screen{display:none; padding:14px 16px 24px;}
  .screen.active{display:block;}

  header.top{
    position:sticky; top:0; z-index:20; background:var(--paper);
    padding:16px 16px 8px; max-width:520px; margin:0 auto;
  }
  .top h1{font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0;}
  .top .sub{font-size:12.5px; color:var(--ink-mute); margin-top:2px;}

  .row{display:flex; gap:8px; align-items:center;}
  .grow{flex:1;}
  .spacer{flex:1;}

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-size:12.5px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line-strong); background:var(--card); color:var(--ink-soft);
    cursor:pointer; user-select:none; transition:.12s; white-space:nowrap;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.tag.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px; box-shadow:var(--shadow); margin-bottom:10px;
  }
  .card.tap{cursor:pointer; transition:.12s;}
  .card.tap:active{transform:scale(.99); border-color:var(--line-strong);}

  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap;}
  .b-db{background:var(--db-soft); color:var(--db);}
  .b-acq{background:var(--acq-soft); color:var(--acq);}
  .b-ok{background:var(--ok-soft); color:var(--ok);}
  .b-hold{background:var(--hold-soft); color:var(--hold);}
  .b-no{background:var(--no-soft); color:var(--no);}
  .b-seg{background:var(--accent-soft); color:var(--accent-ink);}
  .b-grade{background:var(--line); color:var(--ink-soft);}

  .meta{font-size:12px; color:var(--ink-mute); display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .name{font-size:16px; font-weight:600; letter-spacing:-.01em;}

  button.btn{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border-radius:var(--radius-sm); padding:10px 14px; border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink); transition:.12s; display:inline-flex;
    align-items:center; justify-content:center; gap:6px;
  }
  button.btn:active{transform:scale(.98);}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.btn.ghost{background:transparent; border-color:var(--line);}
  button.btn.danger{color:var(--no); border-color:var(--no-soft);}
  button.btn.wide{width:100%;}
  button.btn.sm{padding:7px 11px; font-size:12.5px;}

  label.f{display:block; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin:14px 2px 6px;}
  input.t, textarea.t, select.t{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:11px 12px; outline:none; transition:.12s;
  }
  input.t:focus, textarea.t:focus, select.t:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  textarea.t{resize:vertical; min-height:76px; line-height:1.55;}

  .thumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
  .thumb{position:relative; aspect-ratio:3/4; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); background:var(--paper);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .k{position:absolute; left:5px; top:5px; font-size:10px; padding:2px 6px; border-radius:6px; background:rgba(28,37,48,.72); color:#fff;}
  .thumb .del{position:absolute; right:4px; top:4px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(28,37,48,.72); color:#fff; font-size:14px; line-height:1; cursor:pointer;}
  .add-thumb{aspect-ratio:3/4; border:1.5px dashed var(--line-strong); border-radius:var(--radius-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--ink-mute); font-size:12px; cursor:pointer; background:var(--card);}

  .empty{text-align:center; color:var(--ink-mute); padding:48px 20px; font-size:14px;}
  .empty .big{font-size:15px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}

  .fab{
    position:fixed; right:calc(50% - 260px + 16px); bottom:calc(78px + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:26px; line-height:1; box-shadow:0 4px 14px rgba(47,111,94,.4); cursor:pointer; z-index:30;
  }
  @media(max-width:552px){.fab{right:16px;}}

  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card);
    border-top:1px solid var(--line); display:flex; padding:6px 0 env(safe-area-inset-bottom);
    max-width:520px; margin:0 auto;
  }
  nav.tabs button{
    flex:1; border:none; background:none; font-family:inherit; cursor:pointer;
    padding:8px 4px; color:var(--ink-mute); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs button .ic{font-size:19px; line-height:1;}
  nav.tabs button.on{color:var(--accent); font-weight:600;}

  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(20,24,29,.55);
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; max-width:520px; max-height:92vh; overflow:auto;
    border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet h2{font-size:18px; margin:0 0 2px; font-weight:700;}
  .sheet .close{position:absolute;}
  .handle{width:38px; height:4px; border-radius:2px; background:var(--line-strong); margin:0 auto 14px;}

  /* redaction */
  .redwrap{position:relative; width:100%; background:#0d0f12; border-radius:var(--radius-sm); overflow:hidden; touch-action:none; user-select:none;}
  .redwrap canvas{display:block; width:100%; height:auto;}
  .red-hint{font-size:12.5px; color:var(--ink-soft); background:var(--accent-soft); padding:9px 11px; border-radius:var(--radius-sm); margin-bottom:10px; line-height:1.5;}

  .note{font-size:12px; color:var(--ink-mute); line-height:1.55; margin-top:8px;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .seg-toggle{display:flex; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px; gap:3px; margin-bottom:14px;}
  .seg-toggle button{flex:1; border:none; background:none; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-mute); padding:8px; border-radius:7px; cursor:pointer;}
  .seg-toggle button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}

  .kv{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-soft);}
  .stage-note{border:1px dashed var(--line-strong); border-radius:var(--radius); padding:14px; font-size:13px; color:var(--ink-soft); line-height:1.6; background:var(--card);}
  .pill-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .pt{font-size:11px; padding:3px 8px; border-radius:999px; background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}
</style>
</head>
<body>

<input type="file" id="img-input" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px">

<script>
/* ---------- 상수 ---------- */
const AGES=['20대','30대','40대','50대','60대+'];
const PRODUCTS=['종신','정기','암','건강','실손','연금저축','어린이','CI'];
const SITUATIONS=['신규','리모델링','갱신전환','해약방어','만기도래','증권점검'];
const SEGMENTS=['방문예정','상담','계약'];
const SOURCES=[['db','DB 고객'],['acq','지인 고객']];
const RESULTS=[['성공','ok'],['보류','hold'],['실패','no']];
const IMG_KINDS=['보장급부','내보장자산','기타'];

/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('cust-consult',1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('customers')) d.createObjectStore('customers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('pools')) d.createObjectStore('pools',{keyPath:'id'});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id'});
    };
    r.onsuccess=e=>{db=e.target.result; res();};
    r.onerror=e=>rej(e);
  });
}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function idbAll(store){return new Promise(r=>{const q=tx(store,'readonly').getAll(); q.onsuccess=()=>r(q.result||[]);});}
function idbGet(store,id){return new Promise(r=>{const q=tx(store,'readonly').get(id); q.onsuccess=()=>r(q.result);});}
function idbPut(store,v){return new Promise(r=>{const q=tx(store,'readwrite').put(v); q.onsuccess=()=>r();});}
function idbDel(store,id){return new Promise(r=>{const q=tx(store,'readwrite').delete(id); q.onsuccess=()=>r();});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- 상태 ---------- */
let customers=[], pools=[], curScreen='customers';
let lastAnalysis=null;
const ANALYZE_URL='/api/analyze';
let editingCust=null, editingPool=null, poolType='case';
let custFilter={seg:'전체', src:'전체'};
let poolFilter=[];
let objectUrls=[];

function freeUrls(){objectUrls.forEach(u=>URL.revokeObjectURL(u)); objectUrls=[];}
function blobUrl(b){const u=URL.createObjectURL(b); objectUrls.push(u); return u;}

/* ---------- 헤더 ---------- */
function header(title,sub){
  const old=document.querySelector('header.top'); if(old) old.remove();
  const h=document.createElement('header'); h.className='top';
  h.innerHTML='<h1>'+title+'</h1><div class="sub">'+sub+'</div>';
  document.getElementById('app').prepend(h);
}

/* ---------- 네비 ---------- */
function go(s){
  curScreen=s; freeUrls();
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById('s-'+s).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+s).classList.add('on');
  const fab=document.getElementById('fab');
  fab.style.display = (s==='analysis')?'none':'flex';
  if(s==='customers') renderCustomers();
  if(s==='pools') renderPools();
  if(s==='analysis') fillAnalysisSelect();
  window.scrollTo(0,0);
}
function onFab(){ if(curScreen==='customers') openCustomer(null); else if(curScreen==='pools') openPool(null); }

/* ---------- chip helpers ---------- */
function chipGroup(el, items, selected, multi, onchange){
  el.innerHTML='';
  items.forEach(it=>{
    const val=Array.isArray(it)?it[0]:it, label=Array.isArray(it)?it[1]:it;
    const c=document.createElement('div'); c.className='chip'+(el.classList.contains('tags')?' tag':'');
    c.textContent=label;
    const isOn = multi ? selected.includes(val) : selected===val;
    if(isOn) c.classList.add('on');
    c.onclick=()=>{
      if(multi){ const i=selected.indexOf(val); if(i>=0) selected.splice(i,1); else selected.push(val); }
      else { selected=val; }
      chipGroup(el,items,selected,multi,onchange);
      if(onchange) onchange(selected);
    };
    el.appendChild(c);
  });
}

function computeAge6(d){
  if(!/^\d{6}$/.test(d)) return null;
  let yy=+d.slice(0,2), mm=+d.slice(2,4), dd=+d.slice(4,6);
  if(mm<1||mm>12||dd<1||dd>31) return null;
  const now=new Date(), cy2=now.getFullYear()%100;
  const year=(yy<=cy2)?2000+yy:1900+yy;
  let age=now.getFullYear()-year;
  const bd=new Date(year,mm-1,dd);
  const passed=(now.getMonth()>bd.getMonth())||(now.getMonth()===bd.getMonth()&&now.getDate()>=bd.getDate());
  if(!passed) age--;
  return (age>=0&&age<=120)?age:null;
}
function onBirth6(){
  const d=document.getElementById('c-birth6').value.replace(/\D/g,'').slice(0,6);
  document.getElementById('c-birth6').value=d;

  if(age!=null){

  }
}

/* ---------- OCR (앱 내장) ---------- */
let tessLoading=null;
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res();
    s.onerror=()=>{tessLoading=null; rej(new Error('OCR 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.'));};
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function runOCR(){
  if(!editingCust.images||!editingCust.images.length){alert('먼저 보장 이미지를 추가하세요. 가린 이미지에서 개인정보를 뺀 문자만 추출됩니다.'); return;}
  const btn=document.getElementById('ocr-btn'), prog=document.getElementById('ocr-progress');
  btn.disabled=true; btn.style.opacity=.6; prog.style.display='block'; prog.textContent='OCR 엔진 준비 중… (처음 한 번은 다운로드로 시간이 걸립니다)';
  try{
    await ensureTesseract();
    const n=editingCust.images.length; const groups={'보장급부':[],'내보장자산':[],'기타':[]};
    for(let i=0;i<n;i++){
      const rec=await idbGet('images',editingCust.images[i]); if(!rec||!rec.blob) continue;
      const url=URL.createObjectURL(rec.blob);
      const res=await Tesseract.recognize(url,'kor+eng',{logger:m=>{
        if(m.status==='recognizing text') prog.textContent='이미지 '+(i+1)+'/'+n+' 인식 중 '+Math.round((m.progress||0)*100)+'%';
        else prog.textContent='이미지 '+(i+1)+'/'+n+' 준비 중…';
      }});
      URL.revokeObjectURL(url);
      const kind=(rec.kind && groups[rec.kind])?rec.kind:'기타';
      const txt=(res.data.text||'').trim(); if(txt) groups[kind].push(txt);
    }
    let blocks=[];
    ['보장급부','내보장자산','기타'].forEach(k=>{ if(groups[k].length) blocks.push('['+k+']\n'+groups[k].join('\n')); });
    const joined=blocks.join('\n\n');
    const ta=document.getElementById('c-coverage');
    ta.value = ta.value ? (ta.value+'\n\n'+joined) : joined;
    prog.textContent='추출 완료. 종류별로 묶었어요. "AI로 정리"를 누르면 깔끔하게 다듬습니다. 정리 후에도 숫자는 원본과 대조하세요.';
  }catch(err){ prog.textContent=(err&&err.message)?err.message:'OCR 중 오류가 발생했습니다.'; }
  btn.disabled=false; btn.style.opacity=1;
}
async function tidyCoverage(){
  const ta=document.getElementById('c-coverage');
  const imgs=editingCust.images||[];
  if(!imgs.length){alert('먼저 보장 자료 이미지를 추가하세요.'); return;}
  const btn=document.getElementById('tidy-btn'), prog=document.getElementById('tidy-progress');
  btn.disabled=true; btn.style.opacity=.6; prog.style.display='block';
  try{
    // 1) 기기 내 OCR로 사진에서 글자만 추출 (이미지는 서버로 보내지 않음)
    prog.textContent='OCR 엔진 준비 중… (처음 한 번은 다운로드로 시간이 걸립니다)';
    await ensureTesseract();
    const n=imgs.length; const groups={'보장급부':[],'내보장자산':[],'기타':[]};
    for(let i=0;i<n;i++){
      const rec=await idbGet('images',imgs[i]); if(!rec||!rec.blob) continue;
      const url=URL.createObjectURL(rec.blob);
      const r=await Tesseract.recognize(url,'kor+eng',{logger:m=>{
        if(m.status==='recognizing text') prog.textContent='사진에서 글자 추출 중 '+(i+1)+'/'+n+' · '+Math.round((m.progress||0)*100)+'%';
        else prog.textContent='사진 '+(i+1)+'/'+n+' 준비 중…';
      }});
      URL.revokeObjectURL(url);
      const kind=(rec.kind && groups[rec.kind])?rec.kind:'기타';
      const txt=(r.data.text||'').trim(); if(txt) groups[kind].push(txt);
    }
    let blocks=[];
    ['보장급부','내보장자산','기타'].forEach(k=>{ if(groups[k].length) blocks.push('['+k+']\n'+groups[k].join('\n')); });
    const raw=blocks.join('\n\n').trim();
    if(!raw){ prog.textContent='사진에서 글자를 추출하지 못했습니다. 더 선명한 사진을 쓰거나 보장 텍스트에 직접 입력해 주세요.'; btn.disabled=false; btn.style.opacity=1; return; }
    // 2) 추출한 텍스트만 서버로 전송 (무료 플랜 CPU 한도 회피)
    prog.textContent='AI가 정리·분석 중입니다…';
    const res=await fetch(ANALYZE_URL,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({mode:'tidy', rawText:raw, custName:editingCust.name||'', custAge:(editingCust.ageNum?editingCust.ageNum+'세':'')})});
    const rawResp=await res.text();
    let data;
    try{ data=JSON.parse(rawResp); }
    catch(e){
      prog.textContent='서버 응답 이상 (HTTP '+res.status+'). 본문: '+(rawResp?rawResp.slice(0,400):'(빈 응답)');
      btn.disabled=false; btn.style.opacity=1; return;
    }
    if(!res.ok){prog.textContent='정리 실패: '+(data.error||'오류')+' (HTTP '+res.status+')'; btn.disabled=false; btn.style.opacity=1; return;}
    if(data.text) ta.value=data.text;
    addUsage(data._usage,'보장 정리');
    prog.textContent='정리·분석 완료. 숫자는 원본과 대조해 확인하세요.';
  }catch(err){
    prog.textContent='정리 요청 실패: '+((err&&err.message)?err.message:'오류');
  }
  btn.disabled=false; btn.style.opacity=1;
}

let redState=null;
function pickImage(){

function addImageDirect(file){
  return new Promise(res=>{
    const kind=editingCust.docKind||'보장급부';
    const reader=new FileReader();
    reader.onerror=()=>{alert('사진을 읽지 못했습니다.'); res();};
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>{alert('이미지를 열 수 없습니다. HEIC 등은 JPG로 저장해 올려주세요.'); res();};
      img.onload=()=>{
        try{
          const MAX=1500; let w=img.width,h=img.height;
          if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r);}
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cv.toBlob(async(blob)=>{
            const rid=uid();
            await idbPut('images',{id:rid,kind,blob,created:today()});
            editingCust.images=editingCust.images||[]; editingCust.images.push(rid);
            await renderThumbs(); res();
          },'image/jpeg',0.72);
        }catch(err){ alert('이미지 처리 중 오류: '+(err&&err.message?err.message:err)); res(); }
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function processNextRedact(){ if(!redQueue.length) return; const f=redQueue.shift(); startRedact(f); }
let redQueue=[];
function startRedact(file){
  const reader=new FileReader();
  reader.onerror=()=>alert('사진 파일을 읽지 못했습니다.');
  reader.onload=()=>{
    const img=new Image();
    img.onerror=()=>alert('이미지를 열 수 없습니다. HEIC 등 일부 형식은 지원되지 않을 수 있어요. JPG/PNG로 시도해 주세요.');
    img.onload=()=>{
      try{
        const MAX=1600; let w=img.width,h=img.height;
        if(!w||!h){alert('이미지 크기를 인식하지 못했습니다.'); return;}
        if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r);}
        const canvas=document.getElementById('redcanvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        redState={canvas,ctx,img,w,h,rects:[],drawing:null,start:null,kind:'보장급부'};
        chipGroup(document.getElementById('red-kind'),IMG_KINDS,'보장급부',false,v=>redState.kind=v);
        updateRedCount();
        openSheet('ov-redact');
        bindRedact();
      }catch(err){ alert('가리기 화면 준비 중 오류: '+(err&&err.message?err.message:err)); }
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function redPos(e){
  const c=redState.canvas, r=c.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const sx=c.width/r.width, sy=c.height/r.height;
  return {x:Math.max(0,Math.min(cx*sx,c.width)), y:Math.max(0,Math.min(cy*sy,c.height))};
}
function redDraw(){
  const {ctx,img,w,h,rects,drawing}=redState;
  ctx.drawImage(img,0,0,w,h);
  ctx.fillStyle='#141410';
  rects.forEach(r=>ctx.fillRect(r.x,r.y,r.w,r.h));
  if(drawing) ctx.fillRect(drawing.x,drawing.y,drawing.w,drawing.h);
}
let redBound=false;
function bindRedact(){
  if(redBound) return; redBound=true;
  const c=document.getElementById('redcanvas');
  c.addEventListener('pointerdown',e=>{const p=redPos(e); redState.start=p; redState.drawing={x:p.x,y:p.y,w:0,h:0}; c.setPointerCapture(e.pointerId);});
  c.addEventListener('pointermove',e=>{ if(!redState||!redState.drawing) return; const p=redPos(e),s=redState.start;
    redState.drawing={x:Math.min(p.x,s.x),y:Math.min(p.y,s.y),w:Math.abs(p.x-s.x),h:Math.abs(p.y-s.y)}; redDraw();});
  c.addEventListener('pointerup',()=>{ if(!redState||!redState.drawing) return; const d=redState.drawing;
    if(d.w>6&&d.h>6) redState.rects.push(d); redState.drawing=null; redDraw(); updateRedCount();});
}
function updateRedCount(){document.getElementById('red-count').textContent='가린 곳 '+(redState?redState.rects.length:0);}
function redUndo(){if(redState){redState.rects.pop(); redDraw(); updateRedCount();}}
function redClear(){if(redState){redState.rects=[]; redDraw(); updateRedCount();}}
function redTop(){if(redState){redState.rects.push({x:0,y:0,w:redState.w,h:Math.round(redState.h*0.22)}); redDraw(); updateRedCount();}}
function redSave(){
  redState.drawing=null; redDraw();
  redState.canvas.toBlob(async(blob)=>{
    const rid=uid();
    await idbPut('images',{id:rid,kind:redState.kind,blob,created:today()});
    editingCust.images=editingCust.images||[]; editingCust.images.push(rid);
    closeSheet('ov-redact'); renderThumbs();
    if(redQueue.length) setTimeout(processNextRedact, 200);
  },'image/jpeg',0.82);
}

let mammothLoading=null;
function ensureMammoth(){
  if(window.mammoth) return Promise.resolve();

    const s=document.createElement('script');

    s.onload=()=>res();
    s.onerror=()=>{mammothLoading=null; rej(new Error('문서 처리기를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));};
    document.head.appendChild(s);

async function importDoc(file){
  const prog=document.getElementById('doc-progress'); prog.style.display='block';
  const name=(file.name||'').toLowerCase();
  const kind=editingCust.docKind||'보장급부';
  const append=(txt)=>{const ta=document.getElementById('c-coverage'); const t=(txt||'').trim(); if(!t){prog.textContent='문서에서 읽을 텍스트가 없습니다.'; return;} const block='['+kind+']\n'+t; ta.value = ta.value ? (ta.value+'\n\n'+block) : block; prog.textContent='['+kind+'] 불러오기 완료. 다른 종류도 이어서 불러올 수 있어요. 끝나면 "AI로 정리·분석"을 누르세요.';};
  try{
    if(name.endsWith('.txt')){
      const r=new FileReader(); r.onerror=()=>prog.textContent='파일을 읽지 못했습니다.'; r.onload=()=>append(r.result); r.readAsText(file); return;
    }
    if(name.endsWith('.docx')){
      prog.textContent='워드 문서를 읽는 중…';
      await ensureMammoth();
      const buf=await file.arrayBuffer();
      const result=await window.mammoth.extractRawText({arrayBuffer:buf});
      append(result && result.value ? result.value : '');
      return;
    }
    if(name.endsWith('.hwp')){ prog.textContent='한글(.hwp)은 직접 읽을 수 없어요. 워드(.docx)나 텍스트(.txt)로 저장해 올려주세요.'; return; }
    prog.textContent='지원하지 않는 형식입니다. .docx 또는 .txt로 올려주세요.';
  }catch(err){ prog.textContent=(err&&err.message)?err.message:'문서를 읽는 중 오류가 발생했습니다.'; }
}

async function saveCustomer(){

function blobToDataURL(blob){return new Promise(res=>{const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob);});}
/* 전송 전 이미지 축소·재압축: 긴 변 maxDim, JPEG 품질 q. base64(헤더 제외) 반환 */
function blobToScaledBase64(blob, maxDim, q){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const scale=Math.min(1, maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const durl=cv.toDataURL('image/jpeg', q||0.72);
        URL.revokeObjectURL(img.src);
        resolve((durl.split(',')[1])||'');
      }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); reject(new Error('이미지를 열 수 없습니다(HEIC 등은 JPG/PNG로).')); };
    img.src=URL.createObjectURL(blob);
  });
}

  const images=[];
  for(const id of ids){ const rec=await idbGet('images',id); if(rec&&rec.blob){ images.push({id:rec.id,kind:rec.kind,created:rec.created,dataURL:await blobToDataURL(rec.blob)}); } }

function addPoolImageDirect(file){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onerror=()=>{alert('사진을 읽지 못했습니다.'); res();};
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>{alert('이미지를 열 수 없습니다. HEIC 등은 JPG로 저장해 올려주세요.'); res();};
      img.onload=()=>{
        try{
          const MAX=1500; let w=img.width,h=img.height;
          if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r);}
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cv.toBlob(async(blob)=>{
            const rid=uid();
            await idbPut('images',{id:rid,kind:'설계서',blob,created:today()});
            editingPool.images=editingPool.images||[]; editingPool.images.push(rid);
            await renderPoolThumbs(); res();
          },'image/jpeg',0.72);
        }catch(err){ alert('이미지 처리 중 오류: '+(err&&err.message?err.message:err)); res(); }
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

========================================================= */
const PRICING={opus:[5,25],sonnet:[2,10],haiku:[1,5],fable:[5,25],mythos:[5,25]};
const USD_KRW=1380;
function priceFor(model){const k=Object.keys(PRICING).find(x=>(model||'').includes(x)); return PRICING[k||'sonnet'];}
function loadCost(){try{return JSON.parse(localStorage.getItem('costMeter'))||{balance:null,count:0,correctedAt:null,history:[]};}catch(e){return {balance:null,count:0,correctedAt:null,history:[]};}}
function saveCost(o){try{localStorage.setItem('costMeter',JSON.stringify(o));}catch(e){}}
function addUsage(u,label){
  if(!u) return;
  const pr=priceFor(u.model); const cost=(u.input_tokens/1e6)*pr[0]+(u.output_tokens/1e6)*pr[1];
  const m=loadCost();
  if(m.balance!=null) m.balance=m.balance-cost;
  m.count=(m.count||0)+1;
  m.history=m.history||[];
  m.history.unshift({t:new Date().toISOString(), label:label||'분석', usd:cost});
  if(m.history.length>200) m.history=m.history.slice(0,200);
  saveCost(m);
  return cost;
}
function renderCostMeter(lastCost){
  const el=document.getElementById('cost-meter'); if(!el) return;
  const m=loadCost();
  let s='<div class="card" style="padding:11px 13px"><div class="row"><div style="flex:1">';
  if(m.balance==null){
    s+='<div class="meta">남은 잔액 미설정</div>'
      +'<div style="font-size:15px;font-weight:600;margin-top:2px">보정을 눌러 콘솔 잔액을 입력하세요</div>';
  } else {
    const krw=Math.round(m.balance*USD_KRW);
    s+='<div class="meta">남은 잔액 (추정)'+(m.correctedAt?' · '+m.correctedAt+' 보정':'')+'</div>'
      +'<div style="font-size:16px;font-weight:600;margin-top:2px">US$'+m.balance.toFixed(2)+' <span class="meta" style="font-weight:400">약 '+krw.toLocaleString()+'원 · 보정 후 '+(m.count||0)+'회</span></div>';
  }
  if(lastCost!=null) s+='<div class="meta" style="margin-top:3px">이번 약 US$'+lastCost.toFixed(3)+' ('+Math.round(lastCost*USD_KRW).toLocaleString()+'원) 차감</div>';
  s+='</div></div>'
    +'<div class="row" style="margin-top:8px"><button class="btn ghost sm grow" onclick="correctCost()">보정</button>'
    +'<button class="btn ghost sm grow" onclick="toggleCostHistory()">사용 히스토리</button></div>'
    +'<div id="cost-history" style="display:none;margin-top:8px"></div></div>';
  el.innerHTML=s;
}
function toggleCostHistory(){
  const el=document.getElementById('cost-history'); if(!el) return;
  if(el.style.display!=='none'){el.style.display='none'; return;}
  const m=loadCost(); const h=m.history||[];
  let s='';
  if(!h.length){ s='<div class="stage-note">아직 사용 내역이 없어요.</div>'; }
  else {
    const sum={}; h.forEach(r=>{sum[r.label]=(sum[r.label]||0)+r.usd;});

function correctCost(){
  const m=loadCost();

  // matched pool cases by shared product/situation tags

      +(m.p.result?'<span class="badge b-'+(rc?rc[1]:'hold')+'">'+m.p.result+'</span>':'')+'</div>'
      +'<div class="meta" style="margin-top:5px;">공통 태그 '+m.overlap+'개</div></div>';
  });} else { html+='<div class="stage-note">관련 상담사례가 아직 없어요. 참조 풀에 사례를 쌓을수록 매칭이 정확해집니다.</div>'; }

  html+='<div class="divider"></div>';
  const hasText=(c.coverageText||'').trim().length>0;
  const alist=(c.analyses&&c.analyses.length)?c.analyses:(c.analysis?[{date:c.analysisDate,data:c.analysis}]:[]);
  const hasAnalysis=alist.length>0;
  if(!hasText){
    html+='<div class="stage-note">보장 텍스트가 아직 없습니다. 고객 화면에서 이미지 OCR 또는 직접 입력으로 보장 내용을 채운 뒤 분석하세요.</div>';
  } else if(hasAnalysis){
    html+='<div class="stage-note">저장된 분석 결과입니다 (최근 '+esc(alist[0].date||'')+' · 총 '+alist.length+'회). 다시 분석하면 기록에 추가되며 비용이 한 번 더 듭니다.</div>';
  } else {
    html+='<div class="stage-note">확인된 보장 텍스트를 바탕으로 영역별 취약·충분을 분석합니다. 이미지는 전송하지 않고 텍스트만 보냅니다.</div>';
  }
  html+='<button class="btn primary wide" style="margin-top:12px'+(hasText?'':';opacity:.5')+'" onclick="runAnalysis(\''+c.id+'\')">'+(hasAnalysis?'다시 분석':'분석 실행')+'</button>';
  html+='<div id="an-result" style="margin-top:14px"></div>';
  html+='<div class="divider"></div><div class="row">'
    +'<button class="btn ghost sm grow" onclick="saveConsult(\''+c.id+'\')">상담 저장(파일)</button>'
    +'<button class="btn ghost sm grow" onclick="document.getElementById(\'import-consult\').click()">상담 불러오기</button></div>';
  body.innerHTML=html;
  if(hasAnalysis){ renderResultWithHistory(c, 0); }
}
function renderResultWithHistory(c, idx){
  const list=(c.analyses&&c.analyses.length)?c.analyses:(c.analysis?[{date:c.analysisDate,data:c.analysis}]:[]);
  const entry=list[idx]; if(!entry) return;
  lastAnalysis=entry.data;
  renderAnalysisResult(entry.data, entry.date);
  if(list.length>1){
    let hh='<label class="f">분석 기록 ('+list.length+')</label>';
    list.forEach((e,i)=>{
      const active=i===idx;
      const sm=(e.data&&e.data.summary)?e.data.summary.slice(0,42):'';
      hh+='<div class="card tap" style="'+(active?'border-color:var(--accent);':'')+'" onclick="showHistoryEntry(\''+c.id+'\','+i+')">'
        +'<div class="row"><span style="font-size:13px;font-weight:600">'+esc(e.date||'')+'</span>'+(active?'<span class="spacer"></span><span class="badge b-seg">보는 중</span>':'<span class="spacer"></span><span class="meta">열기</span>')+'</div>'
        +'<div class="meta" style="margin-top:3px">'+esc(sm)+'</div></div>';
    });
    document.getElementById('an-result').insertAdjacentHTML('beforeend', hh);
  }
}
function showHistoryEntry(custId, idx){
  const c=customers.find(x=>x.id===custId); if(!c) return;
  renderResultWithHistory(c, idx);
}
async function runAnalysis(id){
  const c=customers.find(x=>x.id===id); if(!c) return;
  if(!(c.coverageText||'').trim()){alert('보장 텍스트가 비어 있어요. 고객 화면에서 OCR 또는 직접 입력으로 채운 뒤 분석하세요.'); return;}
  const box=document.getElementById('an-result'); box.innerHTML='<div class="stage-note">분석 중입니다… 잠시만 기다려 주세요.</div>';
  // 가입설계서 텍스트 준비 (선택 시 기기 OCR)
  let planText='', planTitle='';
  const planSel=document.getElementById('an-plan');
  const planId=planSel?planSel.value:'';
  if(planId){
    const plan=pools.find(p=>p.id===planId);
    if(plan){ planTitle=plan.title||''; try{ planText=await getPlanText(plan, box); }catch(e){ planText=''; } }
  }
  const want=[...(c.product||[]),...(c.situation||[])];
  const cases=pools.filter(p=>p.poolType==='case').map(p=>{
    const overlap=[...(p.product||[]),...(p.situation||[]),...(p.age||[])].filter(t=>want.includes(t)||t===c.age).length;
    return {overlap,title:p.title,result:p.result,body:p.body};
  }).filter(m=>m.overlap>0).sort((a,b)=>b.overlap-a.overlap).slice(0,3);
  try{
    const res=await fetch(ANALYZE_URL,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({customer:{name:c.name,age:c.age,region:c.region,products:c.product,situations:c.situation},coverageText:c.coverageText,cases,planText})});
    const data=await res.json();
    if(!res.ok){box.innerHTML='<div class="stage-note">분석 실패: '+esc(data.error||'알 수 없는 오류')+'</div>'; return;}
    c.analyses=c.analyses||[];
    c.analyses.unshift({date:today(), data, planTitle});
    if(c.analyses.length>50) c.analyses=c.analyses.slice(0,50);
    c.analysis=data; c.analysisDate=today();
    await idbPut('customers',c);
    const lc=addUsage(data._usage,'매니저 분석');
    lastAnalysis=data; renderAnalysis(); renderCostMeter(lc);
  }catch(err){
    box.innerHTML='<div class="stage-note">분석 요청을 보내지 못했습니다. 넷리파이에 배포된 주소에서 열었는지, 인터넷 연결을 확인하세요. (로컬 파일에서는 분석이 동작하지 않습니다)<br><span class="meta">'+esc(err.message||'')+'</span></div>';
  }
}
/* 가입설계서 텍스트 확보: 본문 + 이미지 OCR(캐시) */
async function getPlanText(plan, box){
  const bodyText=(plan.body||'').trim();
  const imgs=plan.images||[];
  if(plan.planText && plan.planTextImgN===imgs.length){
    return [bodyText, plan.planText].filter(Boolean).join('\n\n');
  }
  if(!imgs.length) return bodyText;
  await ensureTesseract();
  const parts=[];
  for(let i=0;i<imgs.length;i++){
    const rec=await idbGet('images',imgs[i]); if(!rec||!rec.blob) continue;
    const url=URL.createObjectURL(rec.blob);
    const r=await Tesseract.recognize(url,'kor+eng',{logger:m=>{
      if(box){ if(m.status==='recognizing text') box.innerHTML='<div class="stage-note">가입설계서 글자 추출 중 '+(i+1)+'/'+imgs.length+' · '+Math.round((m.progress||0)*100)+'%</div>';
        else box.innerHTML='<div class="stage-note">가입설계서 '+(i+1)+'/'+imgs.length+' 준비 중…</div>'; }
    }});
    URL.revokeObjectURL(url);
    const t=(r.data.text||'').trim(); if(t) parts.push(t);
  }
  const ocr=parts.join('\n\n').trim();
  plan.planText=ocr; plan.planTextImgN=imgs.length;
  try{ await idbPut('pools',plan); }catch(e){}
  return [bodyText, ocr].filter(Boolean).join('\n\n');
}
/* 매니저 상담 저장(파일) */
function saveConsult(id){
  const c=customers.find(x=>x.id===id); if(!c){alert('고객을 먼저 선택하세요.'); return;}
  const list=(c.analyses&&c.analyses.length)?c.analyses:(c.analysis?[{date:c.analysisDate,data:c.analysis}]:[]);
  if(!list.length){alert('저장할 분석 결과가 없습니다. 먼저 분석을 실행하세요.'); return;}
  const pack={ type:'manager-consult', v:1, exported:today(),
    customer:{id:c.id,name:c.name,age:c.age,region:c.region,product:c.product||[],situation:c.situation||[],source:c.source||'db',grade:c.grade||''},
    coverageText:c.coverageText||'', analyses:list };
  const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='매니저상담_'+(c.name||'고객')+'_'+today()+'.json'; a.click();
}
/* 매니저 상담 불러오기(파일) */
async function importConsult(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const pack=JSON.parse(await f.text());
    if(!pack||pack.type!=='manager-consult'||!pack.customer){alert('올바른 상담 파일이 아닙니다.'); return;}
    const cu=pack.customer;
    let c=customers.find(x=>x.id===cu.id)||customers.find(x=>x.name===cu.name);
    if(!c){
      if(!confirm('이 고객이 목록에 없습니다. 새 고객으로 만들어 상담 내용을 불러올까요?')) return;
      c={id:cu.id||uid(), name:cu.name||'(이름없음)', age:cu.age||'', region:cu.region||'', product:cu.product||[], situation:cu.situation||[], source:cu.source||'db', grade:cu.grade||'', seg:'상담', images:[], created:today()};
    }
    if(!(c.coverageText||'').trim()) c.coverageText=pack.coverageText||'';
    const incoming=Array.isArray(pack.analyses)?pack.analyses:[];
    c.analyses=(c.analyses||[]).concat(incoming);
    c.analyses.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(c.analyses.length>50) c.analyses=c.analyses.slice(0,50);
    if(c.analyses[0]){ c.analysis=c.analyses[0].data; c.analysisDate=c.analyses[0].date; }
    await idbPut('customers',c);
    customers=await idbAll('customers');
    document.getElementById('an-cust').value=c.id;
    renderAnalysis();
    alert('상담 내용을 불러왔습니다.');
  }catch(err){ alert('불러오기 실패: '+(err&&err.message?err.message:err)); }
}
function renderAnalysisResult(d, date){
  const box=document.getElementById('an-result'); let h='';
  if(date) h+='<div class="meta" style="margin:0 2px 8px">분석일 '+esc(date)+'</div>';
  if(d.summary) h+='<div class="card"><div style="font-size:14px;line-height:1.6;color:var(--ink-soft)">'+esc(d.summary)+'</div></div>';
  if(d.areas&&d.areas.length){
    h+='<label class="f">영역별 판정</label><div class="card" style="padding:0;overflow:hidden">';
    d.areas.forEach((a,i)=>{
      const lv=a.level||''; const cls=lv==='충분'?'ok':(lv==='보통'?'hold':'no'); const col=lv==='충분'?'var(--ok)':(lv==='보통'?'var(--hold)':'var(--no)');
      h+='<div style="display:flex;gap:10px;padding:11px 13px;border-left:3px solid '+col+';'+(i<d.areas.length-1?'border-bottom:1px solid var(--line);':'')+'">'
        +'<div style="flex:1"><div style="font-size:14px">'+esc(a.name||'')+'</div><div class="meta" style="margin-top:2px">'+esc(a.reason||'')+'</div></div>'
        +'<span class="badge b-'+cls+'" style="align-self:flex-start">'+esc(lv)+'</span></div>';
    });
    h+='</div>';
  }
  if(d.priorities&&d.priorities.length){
    h+='<label class="f">보강 우선순위</label><div class="card">';
    d.priorities.forEach((p,i)=>{h+='<div class="row" style="padding:7px 0;'+(i<d.priorities.length-1?'border-bottom:1px solid var(--line);':'')+'"><span class="badge b-seg" style="min-width:22px;text-align:center">'+(i+1)+'</span><span style="font-size:14px;margin-left:9px">'+esc(p)+'</span></div>';});
    h+='</div>';
  }
  if(d.detail){
    h+='<button class="btn ghost sm wide" onclick="toggleDetail()">자세히 보기 / 접기</button>'
     +'<div id="an-detail" class="card" style="display:none;white-space:pre-wrap;font-size:13.5px;line-height:1.65;color:var(--ink-soft)">'+esc(d.detail)+'</div>';
  }
  if(d.gapFill){
    const g=d.gapFill;
    const rate=Math.max(0,Math.min(100, Math.round(Number(g.shortfallRate)||0)));
    const col=rate>=60?'var(--no)':(rate>=30?'var(--hold)':'var(--ok)');
    h+='<label class="f">가입설계서 반영 · 부족 보장 충족 분석</label><div class="card">';
    h+='<div class="row" style="align-items:center;margin-bottom:8px"><span style="font-size:14px">잔여 부족율</span><span class="spacer"></span><span style="font-size:24px;font-weight:700;color:'+col+'">'+rate+'%</span></div>';
    h+='<div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden"><div style="height:100%;width:'+rate+'%;background:'+col+'"></div></div>';
    if(g.comment) h+='<div style="font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-top:10px">'+esc(g.comment)+'</div>';
    if(g.filled&&g.filled.length){ h+='<div style="margin-top:10px"><div class="meta" style="margin-bottom:4px">설계서가 채운 보장</div>'; g.filled.forEach(x=>{h+='<div class="row" style="padding:3px 0"><span class="badge b-ok" style="min-width:20px;text-align:center">✓</span><span style="font-size:13.5px;margin-left:8px">'+esc(x)+'</span></div>';}); h+='</div>'; }
    if(g.stillMissing&&g.stillMissing.length){ h+='<div style="margin-top:8px"><div class="meta" style="margin-bottom:4px">아직 더 보장해야 할 항목</div>'; g.stillMissing.forEach(x=>{h+='<div class="row" style="padding:3px 0"><span class="badge b-no" style="min-width:20px;text-align:center">!</span><span style="font-size:13.5px;margin-left:8px">'+esc(x)+'</span></div>';}); h+='</div>'; }
    h+='</div>';
  }
  h+='<button class="btn primary wide" style="margin-top:10px" onclick="ttsResult()">▶ 분석 결과 음원으로 듣기</button>';
  box.innerHTML=h;
}
function toggleDetail(){const e=document.getElementById('an-detail'); if(e) e.style.display=e.style.display==='none'?'block':'none';}
function ttsResult(){
  if(!lastAnalysis) return;
  if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.'); return;}
  let t=(lastAnalysis.summary||'')+' ';
  (lastAnalysis.priorities||[]).forEach((p,i)=>{t+='보강 '+(i+1)+', '+p+'. ';});
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; speechSynthesis.speak(u);
}
function ttsDemo(name){
  if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.'); return;}
  const text=name+' 고객님은 현재 보장 자료를 바탕으로 볼 때, 사망 보장은 확보되어 있으나 진단·입원 영역에 공백이 있습니다. '
    +'만기가 다가오는 상품에서 확보되는 여유 보험료를 새로운 보장으로 전환하는 방향을 제안드립니다. '
    +'이것은 예시 음원이며, 실제 분석 결과가 연결되면 이 자리에서 전체 내용을 읽어드립니다.';
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.0;
  speechSynthesis.speak(u);
}

/* ---------- 시트 ---------- */
function openSheet(id){document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden';}
function closeSheet(id){document.getElementById(id).classList.remove('show'); document.body.style.overflow='';}
function fillSelect(id,items,val){const s=document.getElementById(id); if(items){s.innerHTML='<option value="">-</option>'; items.forEach(i=>{const o=document.createElement('option'); o.value=i; o.textContent=i; s.appendChild(o);});} s.value=val||'';}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* 오버레이 배경 탭으로 닫기 */
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o) closeSheet(o.id);}));

/* ---------- 시작 ---------- */
(async function init(){
  await openDB();
  customers=await idbAll('customers');
  pools=await idbAll('pools');
  go('customers');
})();
</script>
